name: Generate Trophies & Activity Graph

on:
  schedule:
    # runs daily at 18:00 UTC (23:30 IST)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-trophy-and-activity-graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        run: |
          curl -s "https://github-profile-trophy.vercel.app/?username=rishijain544&theme=flat" -o trophy.svg

      - name: Generate Activity Graph SVG
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=rishijain544&theme=tokyo-night&hide_border=true" -o activity-graph.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg activity-graph.svg
          if git commit -m "update trophy & activity graph"; then git push; fi
